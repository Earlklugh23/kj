  <!-- iOS 웹앱 전체화면 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="경제지표" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --font-scale: 1;
    }

    body {
      font-family: 'Pretendard', sans-serif;
    }

    /* 유동 폰트 크기 스타일 */
    .card-title-text {
      font-size: calc(12px * var(--font-scale, 1));
    }
    .group-title-text {
      font-size: calc(13.5px * var(--font-scale, 1));
    }
    .desc-title-text {
      font-size: calc(12px * var(--font-scale, 1));
    }
    .desc-content-text {
      font-size: calc(11.5px * var(--font-scale, 1));
      line-height: 1.6;
    }
    .desc-btn-text {
      font-size: calc(10.5px * var(--font-scale, 1));
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 9999px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- 로고 및 타이틀 -->
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-b from-[#193e73] to-[#0b1931] flex items-center justify-center text-white shadow-md shadow-blue-900/30 flex-shrink-0 p-1.5 border border-blue-400/20">
            <svg class="w-full h-full" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="104" cy="28" r="5" fill="#ffffff" opacity="0.9"/>
              <circle cx="117" cy="33" r="4.5" fill="#ffffff" opacity="0.8"/>
              <circle cx="128" cy="40" r="4" fill="#ffffff" opacity="0.65"/>
              <circle cx="138" cy="49" r="3.5" fill="#ffffff" opacity="0.5"/>
              <path fill="#ffffff" fill-rule="evenodd" clip-rule="evenodd" d="M90 38c2.9 0 5.4 1.9 6.2 4.7l1.7 6.1c2.4.6 4.7 1.5 6.9 2.8l5.8-2.6c2.6-1.2 5.7-.6 7.7 1.4l5.6 5.6c2 2 2.6 5.1 1.4 7.7l-2.6 5.8c1.3 2.2 2.2 4.5 2.8 6.9l6.1 1.7c2.8.8 4.7 3.3 4.7 6.2v8c0 2.9-1.9 5.4-4.7 6.2l-6.1 1.7c-.6 2.4-1.5 4.7-2.8 6.9l2.6 5.8c1.2 2.6.6 5.7-1.4 7.7l-5.6 5.6c-2 2-5.1 2.6-7.7 1.4l-5.8-2.6c-2.2 1.3-4.5 2.2-6.9 2.8l-1.7 6.1c-.8 2.8-3.3 4.7-6.2 4.7h-8c-2.9 0-5.4-1.9-6.2-4.7l-1.7-6.1c-2.4-.6-4.7-1.5-6.9-2.8l-5.8 2.6c-2.6 1.2-5.7.6-7.7-1.4l-5.6-5.6c-2-2-2.6-5.1-1.4-7.7l2.6-5.8c-1.3-2.2-2.2-4.5-2.8-6.9l-6.1-1.7c-2.8-.8-4.7-3.3-4.7-6.2v-8c0-2.9 1.9-5.4 4.7-6.2l6.1-1.7c.6-2.4 1.5-4.7 2.8-6.9l-2.6-5.8c-1.2-2.6-.6-5.7 1.4-7.7l5.6-5.6c2-2 5.1-2.6 7.7-1.4l5.8 2.6c2.2-1.3 4.5-2.2 6.9-2.8l1.7-6.1c.8-2.8 3.3-4.7 6.2-4.7h8zm-4 32v60h8V70h12L90 48 74 70h12z"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-2 flex-wrap">
              <h1 class="text-base sm:text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                경기·경제 지표 포털
              </h1>
              <span id="syncStatusBadge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                <span id="syncStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span>
                <span id="syncStatusText">연결 대기</span>
              </span>
            </div>
          </div>
        </div>

        <!-- 우측 툴바 (글자 조절, 설정, 동기화, 원본시트 링크, 테마 전환) -->
        <div class="flex items-center space-x-2">
          <!-- 글자 크기 미세 조절 컨트롤 -->
          <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 gap-1.5 shadow-inner">
            <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium hidden sm:inline-flex items-center gap-1 select-none pr-1 border-r border-slate-200 dark:border-slate-700">
              <i class="fa-solid fa-font text-blue-500 text-[10px]"></i>
              <span>글자</span>
            </span>
            
            <button onclick="changeFontSize(-5)" title="글자 축소" class="p-1 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 rounded transition active:scale-95">
              <i class="fa-solid fa-magnifying-glass-minus text-xs"></i>
            </button>
            
            <!-- 슬라이더 -->
            <input type="range" id="fontSizeRange" min="75" max="200" step="5" value="100" oninput="setFontScale(this.value)" title="글자 크기 미세 조절" class="w-14 sm:w-20 h-1 bg-slate-300 dark:bg-slate-600 rounded-lg cursor-pointer accent-blue-600">

            <button onclick="changeFontSize(5)" title="글자 확대" class="p-1 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 rounded transition active:scale-95">
              <i class="fa-solid fa-magnifying-glass-plus text-xs"></i>
            </button>

            <button onclick="setFontScale(100)" title="기본 크기(100%)로 복원" class="text-[10px] px-1.5 py-0.5 rounded font-mono font-bold text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition select-none">
              <span id="fontSizeDisplay">100%</span>
            </button>
          </div>

          <!-- 연동 설정 버튼 -->
          <button onclick="openSettingsModal()" title="시트 연동 설정 및 진단" class="inline-flex items-center px-2.5 py-1.5 text-xs font-medium rounded-lg text-slate-700 dark:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 transition">
            <i class="fa-solid fa-gear sm:mr-1.5 text-blue-500"></i>
            <span class="hidden sm:inline">연동 설정</span>
          </button>

          <!-- 원본 시트 바로가기 버튼 -->
          <a id="sheetSourceBtn" href="https://docs.google.com/spreadsheets/d/1mxIKOuw_8-SR48bZhJisp00z_OjVx06tlmbKP06HUwg/edit?usp=sharing" target="_blank" title="구글 스프레드시트 열기" class="hidden md:inline-flex items-center px-2.5 py-1.5 text-xs font-medium rounded-lg text-emerald-700 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 dark:text-emerald-300 dark:hover:bg-emerald-900 border border-emerald-200 dark:border-emerald-800 transition">
            <i class="fa-solid fa-file-excel mr-1 text-emerald-600"></i>
            시트 열기
          </a>

          <!-- 실시간 동기화 버튼 -->
          <button id="refreshBtn" onclick="fetchSheetData(true)" title="데이터 새로고침" class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition active:scale-95">
            <i id="refreshIcon" class="fa-solid fa-arrows-rotate sm:mr-1.5"></i>
            <span class="hidden sm:inline">동기화</span>
          </button>

          <!-- 다크모드 토글 -->
          <button id="themeToggleBtn" onclick="toggleTheme()" title="다크/라이트 모드 전환" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 transition">
            <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
    
    <!-- 컨트롤 바: 검색창 및 카테고리 필터 -->
    <div class="mb-5 space-y-3">
      <div class="flex items-center justify-between">
        <!-- 실시간 검색 인풋 (단일 검색창) -->
        <div class="relative w-full max-w-md">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <input
            type="text"
            id="searchInput"
            placeholder="지표명, 그룹 또는 메모 검색..."
            oninput="handleSearch(this.value)"
            class="block w-full pl-8 pr-8 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition"
          />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-circle-xmark text-xs"></i>
          </button>
        </div>
      </div>

      <!-- 카테고리 필터 탭 -->
      <div id="categoryTabs" class="flex items-center space-x-1.5 overflow-x-auto pb-1 custom-scrollbar text-xs">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <!-- 현황 요약 바 & 마지막 동기화 시간 -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 mb-5">
      <div class="flex items-center space-x-2">
        <span>등록 지표: <strong id="totalCount" class="text-blue-600 dark:text-blue-400 font-bold">0</strong>개</span>
        <span>•</span>
        <span>그룹: <strong id="totalGroupCount" class="text-indigo-600 dark:text-indigo-400 font-bold">0</strong>개</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <i class="fa-regular fa-clock text-[11px]"></i>
        <span id="lastSyncedTime" class="font-medium text-slate-600 dark:text-slate-300">연결 시도 중...</span>
      </div>
    </div>

    <!-- 로딩 상태 UI -->
    <div id="loadingState" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 animate-pulse h-16"></div>
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 animate-pulse h-16"></div>
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 animate-pulse h-16"></div>
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 animate-pulse h-16"></div>
    </div>

    <!-- 에러 및 권한 해결 가이드 배너 -->
    <div id="errorState" class="hidden p-5 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-2xl text-amber-900 dark:text-amber-200 mb-5 shadow-sm">
      <div class="flex items-start space-x-3">
        <i class="fa-solid fa-triangle-exclamation text-amber-500 text-xl mt-0.5"></i>
        <div class="space-y-2 flex-1 text-xs sm:text-sm">
          <h3 class="font-bold">스프레드시트 데이터를 가져오지 못했습니다</h3>
          <p id="errorDetailMsg" class="text-amber-800 dark:text-amber-300">
            구글 스프레드시트의 <strong>[웹에 게시]</strong> 설정이 필요하거나 권한을 확인해 주세요.
          </p>
          <div class="flex gap-2 pt-1">
            <button onclick="fetchSheetData(true)" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold">
              <i class="fa-solid fa-arrows-rotate mr-1"></i> 재시도
            </button>
            <button onclick="useMockData()" class="px-3 py-1.5 bg-amber-200 dark:bg-amber-900/60 text-amber-900 dark:text-amber-200 rounded-lg text-xs font-semibold">
              샘플 데이터 확인
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 메인 데이터 컨테이너: 카드 그리드 뷰 -->
    <div id="gridContainer" class="space-y-6">
      <!-- 동적 카드 렌더링 -->
    </div>

    <!-- 검색 결과 없음 상태 -->
    <div id="emptyState" class="hidden text-center py-12">
      <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
        <i class="fa-solid fa-folder-open text-xl"></i>
      </div>
      <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">일치하는 지표 링크가 없습니다</h3>
    </div>

  </main>

  <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-2.5">
        <div class="flex items-center space-x-2 text-blue-600 dark:text-blue-400 font-bold text-base">
          <i class="fa-solid fa-sliders"></i>
          <span>구글 스프레드시트 연동 설정</span>
        </div>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
            스프레드시트 ID 또는 공유 URL
          </label>
          <input
            type="text"
            id="modalSheetInput"
            placeholder="시트 ID 또는 URL 입력"
            class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs"
          />
        </div>

        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
            시트 GID (선택사항)
          </label>
          <input
            type="text"
            id="modalGidInput"
            placeholder="예: 0, 132914528"
            class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs"
          />
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100 dark:border-slate-700">
        <button onclick="closeSettingsModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100">
          닫기
        </button>
        <button onclick="saveSettingsAndSync()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white transition">
          저장 및 동기화
        </button>
      </div>
    </div>
  </div>

  <script>
    let spreadsheetId = '1mxIKOuw_8-SR48bZhJisp00z_OjVx06tlmbKP06HUwg';
    let sheetGid = '132914528';

    const SETTINGS_KEY = 'eco_dash_settings_v3';
    const FONT_SCALE_KEY = 'eco_dash_font_scale';

    // 상태 관리
    let rawItems = [];
    let activeCategory = 'ALL';
    let searchQuery = '';
    let collapsedGroups = new Set();
    let jsonpTimeoutId = null;
    let currentFontScale = 100;

    // 기본 대체 샘플 데이터
    const MOCK_DATA = [
      { group: '국내 거시경제', title: '한국은행 ECOS (경제통계시스템)', url: 'https://ecos.bok.or.kr', desc: '한국 기준금리, 통화량(M2), 물가지수 등 핵심 지표' },
      { group: '해외 거시/중앙은행', title: 'FRED (세인트루이스 연은)', url: 'https://fred.stlouisfed.org', desc: '미국 연준 공식 통계, 역레포 잔고, 실업률' },
      { group: '외환/금리', title: '인베스팅닷컴 USD/KRW 환율', url: 'https://kr.investing.com/currencies/usd-krw', desc: '원/달러 실시간 환율, 달러 인덱스(DXY)' },
      { group: '외환/금리', title: '미국 10년물 국채 수익률 (CNBC)', url: 'https://www.cnbc.com/quotes/US10Y', desc: '글로벌 무위험 지표 금리 및 시장 실질금리 동향' },
      { group: '시장 심리 및 차트', title: 'TradingView (트레이딩뷰)', url: 'https://kr.tradingview.com', desc: '글로벌 증시, 원자재, 선물 종합 차트' },
      { group: '시장 심리 및 차트', title: 'CNN Fear & Greed Index', url: 'https://edition.cnn.com/markets/fear-and-greed', desc: '미국 주식 시장 공포/탐욕 판별 지표' },
      { group: '원자재 및 일정', title: 'WTI 원유 실시간 시세', url: 'https://kr.investing.com/commodities/crude-oil', desc: '국제 유가, 천연가스, 금 등 주요 원자재 가격' },
      { group: '원자재 및 일정', title: '인베스팅 글로벌 경제 캘린더', url: 'https://kr.investing.com/economic-calendar/', desc: 'FOMC, CPI, 고용지표 등 발표 일정' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadFontScale();
      loadSavedSettings();
      updateSheetLink();
      fetchSheetData();

      // 외부 클릭 시 열려있는 설명 말풍선 닫기
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.desc-popover-btn') && !e.target.closest('.desc-popover-box')) {
          document.querySelectorAll('.desc-popover-box').forEach(el => el.classList.add('hidden'));
        }
      });
    });

    /* 글자 크기 조절 기능 */
    function loadFontScale() {
      try {
        const saved = sessionStorage.getItem(FONT_SCALE_KEY);
        if (saved) {
          setFontScale(parseInt(saved, 10), false);
        }
      } catch (e) {}
    }

    function setFontScale(percent, save = true) {
      currentFontScale = Math.min(Math.max(parseInt(percent, 10), 75), 200);
      document.documentElement.style.setProperty('--font-scale', (currentFontScale / 100).toString());
      
      const displayEl = document.getElementById('fontSizeDisplay');
      const rangeEl = document.getElementById('fontSizeRange');
      if (displayEl) displayEl.innerText = `${currentFontScale}%`;
      if (rangeEl) rangeEl.value = currentFontScale;

      if (save) {
        try {
          sessionStorage.setItem(FONT_SCALE_KEY, currentFontScale.toString());
        } catch (e) {}
      }
    }

    function changeFontSize(delta) {
      setFontScale(currentFontScale + delta);
    }

    /* 설정 로드 및 시트 링크 갱신 */
    function loadSavedSettings() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(SETTINGS_KEY));
        if (saved) {
          if (saved.id) spreadsheetId = saved.id;
          if (saved.gid !== undefined) sheetGid = saved.gid;
        }
      } catch (e) {}
    }

    function updateSheetLink() {
      const btn = document.getElementById('sheetSourceBtn');
      if (btn) {
        btn.href = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit${sheetGid ? `?gid=${sheetGid}#gid=${sheetGid}` : ''}`;
      }
    }

    function fetchSheetData(isManual = false) {
      const loading = document.getElementById('loadingState');
      const errorEl = document.getElementById('errorState');
      const refreshIcon = document.getElementById('refreshIcon');
      const badge = document.getElementById('syncStatusBadge');
      const badgeText = document.getElementById('syncStatusText');
      const badgeDot = document.getElementById('syncStatusDot');

      loading.classList.remove('hidden');
      errorEl.classList.add('hidden');
      refreshIcon.classList.add('fa-spin');

      badge.className = 'inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-200 dark:border-amber-800';
      badgeDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse mr-1.5';
      badgeText.innerText = '동기화 중...';

      loadViaJSONP(spreadsheetId, sheetGid, isManual, () => {
        fallbackFetchEndpoints(isManual);
      });
    }

    function loadViaJSONP(id, gid, isManual, onFail) {
      const callbackName = 'googleSheetJSONPCallback_' + Math.floor(Math.random() * 1000000);
      let isHandled = false;

      if (jsonpTimeoutId) clearTimeout(jsonpTimeoutId);
      jsonpTimeoutId = setTimeout(() => {
        if (!isHandled) {
          isHandled = true;
          cleanupScript();
          onFail();
        }
      }, 4000);

      const script = document.createElement('script');
      script.id = callbackName;
      const gidParam = gid ? `&gid=${gid}` : '';
      script.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=responseHandler:${callbackName}${gidParam}&headers=1&t=${Date.now()}`;

      window[callbackName] = function(response) {
        if (isHandled) return;
        isHandled = true;
        clearTimeout(jsonpTimeoutId);
        cleanupScript();

        if (response && response.table) {
          const parsed = parseGVizData(response);
          if (parsed && parsed.length > 0) {
            handleSuccessFetch(parsed, isManual, '실시간 연동');
            return;
          }
        }
        onFail();
      };

      script.onerror = function() {
        if (isHandled) return;
        isHandled = true;
        clearTimeout(jsonpTimeoutId);
        cleanupScript();
        onFail();
      };

      function cleanupScript() {
        const el = document.getElementById(callbackName);
        if (el && el.parentNode) el.parentNode.removeChild(el);
        delete window[callbackName];
      }

      document.body.appendChild(script);
    }

    async function fallbackFetchEndpoints(isManual) {
      const endpoints = [
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json${sheetGid ? `&gid=${sheetGid}` : ''}`,
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv${sheetGid ? `&gid=${sheetGid}` : ''}`,
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv`
      ];

      let success = false;
      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const text = await res.text();

          if (url.includes('tqx=out:json')) {
            const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);/);
            if (match && match[1]) {
              const data = JSON.parse(match[1]);
              const parsed = parseGVizData(data);
              if (parsed.length > 0) {
                handleSuccessFetch(parsed, isManual, '실시간 연동');
                success = true;
                break;
              }
            }
          } else {
            const parsed = parseCSVData(text);
            if (parsed.length > 0) {
              handleSuccessFetch(parsed, isManual, 'CSV 동기화');
              success = true;
              break;
            }
          }
        } catch (e) {}
      }

      if (!success) {
        handleFailFetch();
      }
    }

    function handleSuccessFetch(items, isManual, statusLabel) {
      rawItems = items;
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.add('hidden');
      document.getElementById('refreshIcon').classList.remove('fa-spin');

      const badge = document.getElementById('syncStatusBadge');
      badge.className = 'inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
      document.getElementById('syncStatusDot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1.5';
      document.getElementById('syncStatusText').innerText = statusLabel;
      document.getElementById('lastSyncedTime').innerText = new Date().toLocaleTimeString('ko-KR');

      renderCategories();
      renderAll();
    }

    function handleFailFetch() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('refreshIcon').classList.remove('fa-spin');

      const badge = document.getElementById('syncStatusBadge');
      badge.className = 'inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-200 dark:border-amber-800';
      document.getElementById('syncStatusDot').className = 'w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5';
      document.getElementById('syncStatusText').innerText = '접근 권한 확인 필요';

      if (rawItems.length === 0) {
        useMockData();
      }
    }

    function parseGVizData(gviz) {
      if (!gviz.table || !gviz.table.rows) return [];
      const rows = gviz.table.rows || [];
      const parsed = [];

      rows.forEach(rowObj => {
        const c = rowObj.c || [];
        const values = c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : '');
        if (values.every(v => !v)) return;

        const item = extractItemFields(values);
        if (item.url && item.url !== '#') {
          parsed.push(item);
        }
      });
      return parsed;
    }

    function parseCSVData(csvText) {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length === 0) return [];

      const rows = lines.map(line => parseCSVLine(line));
      const dataRows = rows.slice(1);
      const parsed = [];

      dataRows.forEach(row => {
        const item = extractItemFields(row);
        if (item.url && item.url !== '#') {
          parsed.push(item);
        }
      });
      return parsed;
    }

    function extractItemFields(values) {
      let title = '';
      let url = '';
      let desc = '';
      let group = (values[4] && values[4].trim()) ? values[4].trim() : '';

      let urlIndex = values.findIndex(v => /^https?:\/\//i.test(v));
      if (urlIndex !== -1) {
        url = values[urlIndex];
        if (urlIndex === 2 && values.length >= 3) {
          title = values[1] || values[0] || getDomainName(url);
          desc = values[3] || '';
        } else if (urlIndex === 1 && values.length >= 2) {
          title = values[0] || getDomainName(url);
          desc = values[3] || values[2] || '';
        } else {
          const nonUrls = values.filter((v, idx) => idx !== urlIndex && v.length > 0);
          title = nonUrls[0] || getDomainName(url);
          if (nonUrls[1]) desc = nonUrls[1];
        }
      } else {
        let wwwIndex = values.findIndex(v => /^www\./i.test(v));
        if (wwwIndex !== -1) {
          url = 'https://' + values[wwwIndex];
          title = values[0] || getDomainName(url);
        }
      }

      if (!group) {
        group = (values[0] && values[0] !== title && !values[0].startsWith('http')) ? values[0] : '기타 지표';
      }

      return {
        id: generateHash(title + url + group),
        title: title || '지표 사이트',
        url: url || '#',
        desc: desc || '',
        group: group
      };
    }

    function parseCSVLine(text) {
      let p = '', row = [''], i = 0, s = true;
      for (let l of text) {
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) row[i] = '';
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = [''];
          i = 0;
        } else row[i] += l;
        p = l;
      }
      return row;
    }

    function generateHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return 'id_' + Math.abs(hash);
    }

    function getDomainName(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace('www.', '');
      } catch (e) {
        return 'link';
      }
    }

    function useMockData() {
      rawItems = MOCK_DATA.map((item, idx) => ({ ...item, id: 'mock_' + idx }));
      document.getElementById('lastSyncedTime').innerText = '샘플 데이터';
      renderCategories();
      renderAll();
    }

    function renderCategories() {
      const groups = ['ALL', ...new Set(rawItems.map(i => i.group).filter(Boolean))];
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '';

      groups.forEach(grp => {
        const count = grp === 'ALL' ? rawItems.length : rawItems.filter(i => i.group === grp).length;
        const btn = document.createElement('button');
        btn.onclick = () => selectCategory(grp);
        
        const isSelected = activeCategory === grp;
        btn.className = `flex-shrink-0 px-2.5 py-1 rounded-lg font-medium transition flex items-center space-x-1.5 ${
          isSelected 
            ? 'bg-indigo-600 text-white shadow-sm' 
            : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'
        }`;
        
        btn.innerHTML = `
          <span>${grp === 'ALL' ? '전체' : grp}</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full ${isSelected ? 'bg-indigo-700 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500'} font-bold">${count}</span>
        `;
        container.appendChild(btn);
      });
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderAll();
    }

    function getFilteredItems() {
      return rawItems.filter(item => {
        if (activeCategory !== 'ALL' && item.group !== activeCategory) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = item.title.toLowerCase().includes(q);
          const matchGroup = (item.group || '').toLowerCase().includes(q);
          const matchDesc = item.desc.toLowerCase().includes(q);
          if (!matchTitle && !matchGroup && !matchDesc) return false;
        }
        return true;
      });
    }

    function renderAll() {
      const items = getFilteredItems();
      document.getElementById('totalCount').innerText = rawItems.length;
      document.getElementById('totalGroupCount').innerText = new Set(rawItems.map(i => i.group).filter(Boolean)).size;

      const emptyState = document.getElementById('emptyState');
      const gridContainer = document.getElementById('gridContainer');

      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        gridContainer.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      gridContainer.classList.remove('hidden');
      renderGridView(items);
    }

    function toggleGroupCollapse(encodedGroupName) {
      const groupName = decodeURIComponent(encodedGroupName);
      if (collapsedGroups.has(groupName)) {
        collapsedGroups.delete(groupName);
      } else {
        collapsedGroups.add(groupName);
      }
      renderAll();
    }

    function toggleDescPopover(itemId, event) {
      event.stopPropagation();
      const popover = document.getElementById('popover_' + itemId);
      if (!popover) return;
      const isHidden = popover.classList.contains('hidden');
      // 모든 다른 팝오버 닫기
      document.querySelectorAll('.desc-popover-box').forEach(el => el.classList.add('hidden'));
      if (isHidden) {
        popover.classList.remove('hidden');
      }
    }

    function renderGridView(items) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      const grouped = {};
      items.forEach(item => {
        const grp = item.group || '기타';
        if (!grouped[grp]) grouped[grp] = [];
        grouped[grp].push(item);
      });

      Object.entries(grouped).forEach(([groupName, groupItems]) => {
        const isCollapsed = collapsedGroups.has(groupName);
        const encodedName = encodeURIComponent(groupName);

        const section = document.createElement('section');
        section.className = 'bg-white dark:bg-slate-800/80 p-3.5 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm transition';

        // 그룹 헤더: 그룹명, 카운트, 접기/펼치기 버튼
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-700/80';
        header.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 rounded-md bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-xs">
              <i class="fa-solid fa-layer-group text-[10px]"></i>
            </span>
            <h2 class="group-title-text font-bold text-slate-800 dark:text-slate-100">
              ${groupName}
            </h2>
            <span class="px-1.5 py-0.2 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">
              ${groupItems.length}
            </span>
          </div>

          <!-- 그룹 보이기/숨기기 버튼 -->
          <button onclick="toggleGroupCollapse('${encodedName}')" class="inline-flex items-center px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700/70 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-slate-700 transition">
            <i class="fa-solid ${isCollapsed ? 'fa-chevron-down' : 'fa-chevron-up'} mr-1 text-[10px]"></i>
            <span>${isCollapsed ? '그룹 펼치기' : '그룹 숨기기'}</span>
          </button>
        `;
        section.appendChild(header);

        // 카드 목록 (접혀있지 않을 때만 표시)
        if (!isCollapsed) {
          const cardsGrid = document.createElement('div');
          cardsGrid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5 pt-3';

          groupItems.forEach(item => {
            const domain = getDomainName(item.url);
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

            const card = document.createElement('div');
            card.className = 'relative group bg-slate-50 dark:bg-slate-900/60 hover:bg-white dark:hover:bg-slate-900 border border-slate-200/80 dark:border-slate-700/60 hover:border-indigo-400 dark:hover:border-indigo-500 rounded-xl p-2.5 flex items-center justify-between transition shadow-none hover:shadow-md';
            
            card.innerHTML = `
              <!-- 링크 영역: 파비콘 아이콘 + 지표명 -->
              <a href="${item.url}" target="_blank" class="flex items-center space-x-2.5 min-w-0 flex-1 pr-1.5" title="${item.title}">
                <div class="w-7 h-7 rounded-lg bg-white dark:bg-slate-800 p-1 flex-shrink-0 flex items-center justify-center border border-slate-200 dark:border-slate-700">
                  <img src="${faviconUrl}" alt="" class="w-4 h-4 object-contain" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%234f46e5%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>';" />
                </div>
                <span class="card-title-text font-semibold text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 truncate">
                  ${item.title}
                </span>
              </a>

              <!-- 설명 팝오버 버튼 -->
              ${item.desc ? `
                <div class="relative flex-shrink-0">
                  <button type="button" onclick="toggleDescPopover('${item.id}', event)" class="desc-popover-btn desc-btn-text px-1.5 py-0.5 font-medium text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-300 bg-white dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 border border-slate-200 dark:border-slate-700 rounded-md transition" title="설명 보기">
                    설명
                  </button>
                  <!-- 클릭 시 노출되는 말풍선 -->
                  <div id="popover_${item.id}" class="desc-popover-box hidden absolute right-0 top-7 z-30 w-64 max-w-[80vw] p-3 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 rounded-xl shadow-2xl space-y-1.5">
                    <div class="desc-title-text font-bold border-b border-slate-700 dark:border-slate-300 pb-1 text-indigo-300 dark:text-indigo-700 truncate">
                      ${item.title}
                    </div>
                    <p class="desc-content-text font-normal break-words">${item.desc}</p>
                  </div>
                </div>
              ` : ''}
            `;
            cardsGrid.appendChild(card);
          });
          section.appendChild(cardsGrid);
        }

        container.appendChild(section);
      });
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderAll();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderAll();
    }

    function openSettingsModal() {
      document.getElementById('modalSheetInput').value = spreadsheetId;
      document.getElementById('modalGidInput').value = sheetGid || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettingsAndSync() {
      const input = document.getElementById('modalSheetInput').value.trim();
      const gidInput = document.getElementById('modalGidInput').value.trim();

      if (input) {
        const idMatch = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
        spreadsheetId = (idMatch && idMatch[1]) ? idMatch[1] : input;

        const gidMatch = input.match(/[#&?]gid=([0-9]+)/);
        sheetGid = (gidMatch && gidMatch[1]) ? gidMatch[1] : gidInput;

        try {
          sessionStorage.setItem(SETTINGS_KEY, JSON.stringify({ id: spreadsheetId, gid: sheetGid }));
        } catch (e) {}

        updateSheetLink();
        closeSettingsModal();
        fetchSheetData(true);
      }
    }

    function initTheme() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('themeIcon');
      if (isDark) {
        icon.className = 'fa-solid fa-sun text-amber-400 text-xs';
      } else {
        icon.className = 'fa-solid fa-moon text-xs';
      }
    }
  </script>
</body>
</html>
